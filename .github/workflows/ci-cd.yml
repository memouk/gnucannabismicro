# CI/CD GNUCannabis — GitHub Actions
# Disparador: push y PR en main, master, dev e integration.
# Flujo: validar codigo -> construir imagenes -> prueba de integracion -> CD en main/master.

name: CI/CD GNUCannabis

on:
  push:
    branches:
      - main
      - master
      - dev
      - integration
  pull_request:
    branches:
      - main
      - master
      - dev
      - integration

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-codigo:
    name: CI - Validar codigo Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxis del backend
        run: python -m compileall -q src

      - name: Validar dependencias instalables
        run: pip check

  construir-imagenes:
    name: CI - Construir imagenes Docker
    runs-on: ubuntu-latest
    needs: validar-codigo
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen API (auth-users-api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: gnucannabis-auth-users-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: gnucannabis-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prueba-integracion:
    name: CI - Prueba de integracion (API + MySQL)
    runs-on: ubuntu-latest
    needs: construir-imagenes
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Levantar stack de integracion
        run: docker compose -f docker-compose.ci.yml up -d --build --wait

      - name: Comprobar endpoint de salud
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondio a tiempo"
          docker compose -f docker-compose.ci.yml logs auth-users-api
          exit 1

      - name: Comprobar frontend (Nginx)
        run: curl -fsS -o /dev/null http://localhost:3000/

      - name: Detener contenedores
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  despliegue:
    name: CD - Despliegue (simulado)
    runs-on: ubuntu-latest
    needs: prueba-integracion
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Resumen de despliegue
        run: |
          echo "Pipeline CI/CD completado para GNUCannabis"
          echo "Commit: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Autor: ${{ github.actor }}"
          echo ""
          echo "En un entorno real aqui se publicarian las imagenes Docker"
          echo "o se desplegaria en Azure/AWS/Kubernetes."

      - name: Marcar artefacto de entrega
        run: echo "gnucannabis-build-${{ github.sha }}" > release-tag.txt

      - name: Subir etiqueta de build
        uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-tag.txt
