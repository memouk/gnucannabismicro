# CI/CD GNUCannabis — flujo de la materia
#
# 1. Desde dev se crea feature/<numero-caso>, se sube y se integra a dev (PR).
# 2. Aprobado en dev  -> se promueve a integration.
# 3. Aprobado en integration -> se promueve a master (produccion).
#
# CI: en push/PR de feature, dev, integration y master.
# CD: solo en push a dev, integration o master (no en ramas feature).

name: CI/CD GNUCannabis

on:
  push:
    branches:
      - dev
      - integration
      - master
      - main
      - "feature/**"
  pull_request:
    branches:
      - dev
      - integration
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-codigo:
    name: CI - Validar codigo Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Etapa del flujo Git
        run: |
          echo "Rama: ${{ github.head_ref || github.ref_name }}"
          echo "Evento: ${{ github.event_name }}"
          case "${{ github.head_ref || github.ref_name }}" in
            feature/*) echo "Etapa: desarrollo de caso (feature -> dev)" ;;
            dev) echo "Etapa: rama de desarrollo integrado" ;;
            integration) echo "Etapa: pre-produccion (dev aprobado)" ;;
            master|main) echo "Etapa: produccion (integration aprobado)" ;;
            *) echo "Etapa: validacion general" ;;
          esac

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxis del backend
        run: python -m compileall -q src

      - name: Validar dependencias instalables
        run: pip check

  construir-imagenes:
    name: CI - Construir imagenes Docker
    runs-on: ubuntu-latest
    needs: validar-codigo
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen API (auth-users-api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: gnucannabis-auth-users-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: gnucannabis-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prueba-integracion:
    name: CI - Prueba de integracion (API + MySQL)
    runs-on: ubuntu-latest
    needs: construir-imagenes
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Levantar stack de integracion
        run: docker compose -f docker-compose.ci.yml up -d --build --wait

      - name: Comprobar endpoint de salud
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondio a tiempo"
          docker compose -f docker-compose.ci.yml logs auth-users-api
          exit 1

      - name: Comprobar frontend (Nginx)
        run: curl -fsS -o /dev/null http://localhost:3000/

      - name: Detener contenedores
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  despliegue-dev:
    name: CD - Despliegue entorno DEV
    runs-on: ubuntu-latest
    needs: prueba-integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment: development
    steps:
      - name: Resumen despliegue DEV
        run: |
          echo "CD: codigo integrado en rama dev (casos aprobados desde feature/*)"
          echo "Commit: ${{ github.sha }}"
          echo "Siguiente paso del flujo: PR dev -> integration"

  despliegue-integration:
    name: CD - Despliegue entorno INTEGRATION
    runs-on: ubuntu-latest
    needs: prueba-integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    environment: integration
    steps:
      - name: Resumen despliegue INTEGRATION
        run: |
          echo "CD: build promovido desde dev (aprobado)"
          echo "Commit: ${{ github.sha }}"
          echo "Siguiente paso del flujo: PR integration -> master"

  despliegue-master:
    name: CD - Despliegue entorno PRODUCCION (master)
    runs-on: ubuntu-latest
    needs: prueba-integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Resumen despliegue PRODUCCION
        run: |
          echo "CD: release en master (integration aprobado)"
          echo "Commit: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Autor: ${{ github.actor }}"

      - name: Marcar artefacto de release
        run: echo "gnucannabis-${{ github.ref_name }}-${{ github.sha }}" > release-tag.txt

      - name: Subir etiqueta de build
        uses: actions/upload-artifact@v4
        with:
          name: release-tag-master
          path: release-tag.txt
